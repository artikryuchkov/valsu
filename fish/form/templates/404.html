{% extends "base.html" %}
{% if user.is_authenticated %}
{% block content %}
    <div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
        <div class="max-w-lg w-full">
            <div class="bg-white rounded-2xl shadow-sm p-8 text-center">
                <div class="flex justify-center mb-6">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-file-question w-16 h-16 text-blue-600">
                        <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path>
                        <path d="M10 10.3c.2-.4.5-.8.9-1a2.1 2.1 0 0 1 2.6.4c.3.4.5.8.5 1.3 0 1.3-2 2-2 2"></path>
                        <path d="M12 17h.01"></path>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold text-gray-900 mb-2">Страница не найдена</h1>
                <p class="text-gray-600 mb-2">Страница, которую вы ищете, не существует</p>
                <p class="text-sm text-gray-500 mb-8">Пожалуйста, обратитесь в <a class="text-blue-600" href="/support">поддержку</a>, если считаете, что произошла ошибка</p>
                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                        <button onclick="window.location.href = '/'"
                        class="inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-lg text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">На главную</button></div>
            </div>
        </div>
    </div>
{% endblock %}
{% else %}
<meta http-equiv="REFRESH" content="0;url=/">
{% endif %}
