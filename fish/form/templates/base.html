    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const toggleButton = document.querySelector('.help button');
            const popupDiv = document.querySelector('.help .absolute');
            const closeButton = popupDiv.querySelector('button[class*="help"]');
            popupDiv.classList.add('popup-transition', 'popup-hidden');
            function showPopup() {
                popupDiv.classList.remove('popup-hidden');
                popupDiv.classList.add('popup-visible');
            }
            function hidePopup() {
                popupDiv.classList.remove('popup-visible');
                popupDiv.classList.add('popup-hidden');
            }
            toggleButton.addEventListener('click', function(e) {
                e.stopPropagation();
                if (popupDiv.classList.contains('popup-visible')) {
                    hidePopup();
                } else {
                    showPopup();
                }
            });
            closeButton.addEventListener('click', function(e) {
                e.stopPropagation();
                hidePopup();
            });
            document.addEventListener('click', function(e) {
                if (!popupDiv.contains(e.target) && e.target !== toggleButton) {
                    hidePopup();
                }
            });
            popupDiv.addEventListener('click', function(e) {
                e.stopPropagation();
            });
        });
    </script>
    <!-- MyTracker counter -->
    <script>

                    <a href="{% static '/Руководство_пользователя_Личный_Кабинет_преподаватель_v3.pdf' %}" target="_blank"

            <div class="mt-3 pt-3 border-t border-gray-200"><button
                    class="help text-xs text-gray-500 hover:text-blue-500">Закрыть</button>
            </div>
        </div>
    </div>
</div>
