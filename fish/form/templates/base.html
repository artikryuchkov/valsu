<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Учебный проект</title><meta name="description" content="Независимый учебный сайт на Django. Без регистрации и сбора данных."><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f5f5ef;color:#19352b;font:17px/1.6 system-ui,sans-serif}header,main,footer{max-width:1120px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid #d4dfd6}header a{font-weight:750;color:inherit;text-decoration:none}header span,.eyebrow{font-size:12px;letter-spacing:2px;font-weight:700}header span{background:#e0e9df;padding:6px 12px;border-radius:30px}main{padding-top:65px}h1{font-size:clamp(38px,6vw,72px);line-height:1.1;letter-spacing:-2px;margin:20px 0}h2{font-size:30px}h3{margin:12px 0}.intro{max-width:650px;font-size:20px;color:#506459}.notice{max-width:680px;border-left:4px solid #52755a;background:#e8eee2;padding:20px 24px;margin:30px 0}.notice p{margin:6px 0 0}.button{display:inline-block;background:#234e3c;color:white;padding:13px 22px;border-radius:8px;text-decoration:none}.button:hover{background:#163a2a}a:focus-visible{outline:3px solid #b87713;outline-offset:5px}section{padding-top:65px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}article{background:white;border:1px solid #dce4db;border-radius:14px;padding:24px}article span{color:#688471}article p{color:#506459}footer{margin-top:40px;color:#506459;font-size:13px}@media(max-width:680px){.cards{grid-template-columns:1fr}header,main,footer{padding-left:20px;padding-right:20px}header{flex-wrap:wrap}h1{letter-spacing:-1px}}
</style></head>
<body><header><a href="/">Практика / Django</a><span>Демонстрация</span></header><main>{% block content %}{% endblock %}</main><footer>Учебный проект · Не связан с университетами или их сервисами.</footer></body></html>
