{% extends "base.html" %}
{% block content %}
        <div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
                <div class="flex flex-col justify-center py-12 sm:px-6 lg:px-8">
                    <div class="sm:mx-auto sm:w-full sm:max-w-md">
                        <h2 class="mt-6 text-center text-3xl font-bold text-gray-900">Войти в личный кабинет ВолГУ</h2>
                    </div>
                    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
                        <div class="bg-white py-8 px-4 shadow-xl rounded-2xl sm:px-10">
                            {% for message in messages %}
                            <div class="alert alert-dismissible alert-success">
                                <button type="button" class="alert" data-dismiss="alert">
                                </button>
                                <strong style="color: red;">{{message}}</strong>
                            </div>
                            {% endfor %}          
                            <form class="space-y-6" method="post">
                                {% csrf_token %}
                                <div><label for="email" class="block text-sm font-medium text-gray-700">Логин</label>
                                    <div class="mt-1"><input id="id_username" name="username" type="text" 
                                            required=""
                                            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                                    </div>
                                </div>
                                <div><label for="password"
                                        class="block text-sm font-medium text-gray-700">Пароль</label>
                                    <div class="mt-1 flex-1 relative"><input id="id_password" name="password" type="password"
                                            autocomplete="current-password" required=""
                                            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                                            <button type="button" class="absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye w-5 h-5">
                                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                                                <circle cx="12" cy="12" r="3"></circle>
                                            </svg></button>
                                    </div>
                                </div>
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center"><input id="remember-me" name="remember-me"
                                            type="checkbox"
                                            class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"><label
                                            for="remember-me" class="ml-2 block text-sm text-gray-900">Запомнить</label></div><a href="/404"
                                        class="text-sm font-medium text-blue-600 hover:text-blue-500">Забыли пароль?</a>
                                </div>
                                <div><button type="submit"
                                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">Авторизоваться</button></div>
                                <div class="text-sm text-center"><span class="text-gray-600">Есть вопрос?</span> <a href = "/404"
                                        class="font-medium text-blue-600 hover:text-blue-500">Обратиться в поддержку</a>
                                </div>
                                <div class="text-sm text-center"> 
                                    <a href="/404" class="font-medium text-blue-600 hover:text-blue-500">Восстановить пароль <span class="block-mob">от корпоративной почты</span></a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const passwordInput = document.getElementById("id_password");
            const toggleButton = passwordInput.nextElementSibling;
            const eyeIcon = toggleButton.querySelector("svg");

            toggleButton.addEventListener("click", function() {
                const isPasswordVisible = passwordInput.type === "text";

                // Переключаем тип поля ввода
                passwordInput.type = isPasswordVisible ? "password" : "text";

                // Меняем иконку
                eyeIcon.innerHTML = isPasswordVisible ? `
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                ` : `
                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                    <line x1="2" x2="22" y1="2" y2="22"></line>
                `;
            });
        });
    </script>
{% endblock %}
